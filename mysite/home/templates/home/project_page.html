{% load wagtailcore_tags %}

<!DOCTYPE html>
<html>
<head>
    <title>{{ page.title }}</title>
</head>
<body>

    <h1>{{ page.title }}</h1>
    <p style="color: gray;">Gemaakt op: {{ page.date }}</p>

    <p><strong>Korte samenvatting:</strong> {{ page.korte_uitleg }}</p>

    <div class="project-uitleg">
        <h2>Over dit project</h2>
        {{ page.uitgebreide_uitleg|richtext }}
    </div>

    {% if page.github_link %}
        <p><a href="{{ page.github_link }}" target="_blank">Bekijk de code op GitHub →</a></p>
    {% endif %}

    <br>
    <a href="/projecten/">← Terug naar alle projecten</a>

</body>
</html>
